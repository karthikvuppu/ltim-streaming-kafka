# Default values for kafka-eks
# This is a YAML-formatted file.

# Strimzi Kafka Operator
strimzi:
  enabled: true
  watchNamespaces: []

# Kafka Cluster Configuration
kafka:
  # Cluster name
  name: my-kafka

  # Kafka version
  version: 3.8.0

  # Pod Security Context (enable in production)
  podSecurityContext:
    enabled: false
    runAsNonRoot: true
    runAsUser: 1000
    fsGroup: 0
    seccompProfile:
      type: RuntimeDefault

  # Listeners configuration
  listeners:
    plain:
      enabled: true
      port: 9092
      type: internal
      tls: false
      authentication:
        type: ""  # Set to scram-sha-512 to require authentication

    external:
      enabled: true
      port: 9094
      type: loadbalancer
      tls: false  # Set to true in production environments
      authentication:
        type: ""  # Set to scram-sha-512 in production environments
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-internal: "true"

    tls:
      enabled: false
      port: 9093
      type: internal
      authentication:
        type: ""  # scram-sha-512, tls, oauth

  # Authorization configuration
  authorization:
    type: ""  # Set to "simple" in production for ACL-based authorization
    superUsers: []

  # Kafka broker configuration
  config:
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    default.replication.factor: 3
    min.insync.replicas: 2
    log.retention.hours: 168  # 7 days
    log.segment.bytes: 1073741824  # 1GB
    num.network.threads: 3
    num.io.threads: 8
    socket.send.buffer.bytes: 102400
    socket.receive.buffer.bytes: 102400
    socket.request.max.bytes: 104857600
    auto.create.topics.enable: true  # Disable in production (set to false)

  # Resource limits and requests
  resources:
    requests:
      memory: 2Gi
      cpu: 500m
    limits:
      memory: 4Gi
      cpu: 2000m

  # JVM Options
  jvmOptions:
    xms: 1024m
    xmx: 2048m

  # Logging
  logging:
    level: INFO
    # Suppress ZooKeeper client logger — not used in KRaft mode
    zookeeperLogLevel: "OFF"
    # Audit logging configuration (enable in production)
    auditLogging:
      enabled: false
      loggers:
        kafka.authorizer.logger: "INFO, AUTHORIZERAPPENDER"
      appenders: |
        # Audit log appender
        log4j.appender.AUTHORIZERAPPENDER=org.apache.log4j.RollingFileAppender
        log4j.appender.AUTHORIZERAPPENDER.File=/var/log/kafka/kafka-authorizer.log
        log4j.appender.AUTHORIZERAPPENDER.MaxFileSize=100MB
        log4j.appender.AUTHORIZERAPPENDER.MaxBackupIndex=10
        log4j.appender.AUTHORIZERAPPENDER.layout=org.apache.log4j.PatternLayout
        log4j.appender.AUTHORIZERAPPENDER.layout.ConversionPattern=[%d] %p %m (%c)%n

  # Metrics
  metrics:
    enabled: true

# KRaft metadata version (must match Kafka version)
kraft:
  metadataVersion: "3.8-IV0"

# KafkaNodePool configuration
# Production default: separate controller and broker pools
nodePools:
  - name: controller
    roles:
      - controller
    replicas: 3
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: false
      class: gp2
    resources:
      requests:
        memory: 1Gi
        cpu: 250m
      limits:
        memory: 2Gi
        cpu: 1000m
    jvmOptions:
      xms: 512m
      xmx: 1024m
  - name: broker
    roles:
      - broker
    replicas: 3
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 10Gi
          deleteClaim: false
          class: gp2
    resources:
      requests:
        memory: 2Gi
        cpu: 500m
      limits:
        memory: 4Gi
        cpu: 2000m
    jvmOptions:
      xms: 1024m
      xmx: 2048m

# Entity Operator (Topic and User management)
entityOperator:
  enabled: true

  topicOperator:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

  userOperator:
    resources:
      requests:
        memory: 256Mi
        cpu: 100m
      limits:
        memory: 512Mi
        cpu: 500m

# Example Topics (deployed with chart)
topics:
  enabled: false
  topics:
    - name: test-topic
      partitions: 3
      replicas: 3
      config:
        retention.ms: 604800000  # 7 days
        segment.bytes: 1073741824  # 1GB
        compression.type: producer
        min.insync.replicas: 2

# Monitoring
monitoring:
  # Enable Prometheus ServiceMonitor
  serviceMonitor:
    enabled: false
    namespace: monitoring
    interval: 30s

  # Enable PodMonitor
  podMonitor:
    enabled: false
    namespace: monitoring
    interval: 30s

# Kafka UI (provectuslabs/kafka-ui)
kafkaUI:
  enabled: false
  image:
    repository: provectuslabs/kafka-ui
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: 256Mi
      cpu: 200m
    limits:
      memory: 512Mi
      cpu: 500m
  service:
    type: ClusterIP  # ClusterIP or LoadBalancer
    port: 8080
    annotations: {}
  auth:
    enabled: false
    username: admin
    password: ""  # Set in environment-specific values
  kafka:
    sasl:
      enabled: false       # Set to true when Kafka requires SCRAM-SHA-512 auth
      username: kafka-admin
      secretName: kafka-admin  # Strimzi-generated secret for kafka-admin user

# Namespace to deploy into
namespaceOverride: ""

# Storage Class (for encrypted volumes)
storageClass:
  enabled: false  # Enable in production
  name: kafka-gp3-encrypted
  provisioner: ebs.csi.aws.com
  type: gp3
  encrypted: true
  kmsKeyId: ""  # Optional: Specify KMS key ARN for encryption
  iops: 3000
  throughput: 125
  volumeBindingMode: WaitForFirstConsumer
  allowVolumeExpansion: true
  reclaimPolicy: Retain

# Network Policy
networkPolicy:
  enabled: false  # Enable in production
  allowedNamespaces:
    - default  # List namespaces that can access Kafka
  monitoringNamespace: monitoring
  allowExternalEgress: true  # Allow Kafka to make external connections

# AWS Glue Schema Registry Integration
# Application pods use GlueSchemaRegistryKafkaSerializer/Deserializer via IRSA
# No extra server required - fully managed AWS service
glueSchemaRegistry:
  enabled: false
  region: ""                    # AWS region, e.g. eu-north-1
  registryName: ""              # Glue registry name, e.g. ltim-sandbox-kafka-registry
  compatibility: BACKWARD       # Schema compatibility: NONE | DISABLED | BACKWARD | FORWARD | FULL
  autoRegistration: true        # Auto-register new schemas on first produce
  serviceAccount:
    create: true
    name: kafka-schema-registry-sa
    roleArn: ""                 # Set from Terraform output: kafka_schema_registry_role_arn

# Kafka Users (for ACL-based authentication)
users:
  enabled: false
  users: []
    # Example user configuration:
    # - name: my-app-user
    #   authentication:
    #     type: scram-sha-512
    #   authorization:
    #     type: simple
    #     acls:
    #       - resource:
    #           type: topic
    #           name: my-topic
    #           patternType: literal
    #         operations: [Read, Write, Describe]
    #       - resource:
    #           type: group
    #           name: my-consumer-group
    #           patternType: literal
    #         operations: [Read]
