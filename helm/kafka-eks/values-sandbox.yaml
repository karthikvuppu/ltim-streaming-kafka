# Sandbox environment values
# Testing and experimentation environment with moderate resources

kafka:
  resources:
    requests:
      memory: 1Gi
      cpu: 500m
    limits:
      memory: 2Gi
      cpu: 1000m

  jvmOptions:
    xms: 512m
    xmx: 1024m

  config:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    default.replication.factor: 1
    min.insync.replicas: 1
    log.retention.hours: 48  # 2 days
    auto.create.topics.enable: false  # Disabled - required when ACLs are enabled

  # ACL-based authorization
  authorization:
    type: simple
    superUsers:
      - User:CN=my-kafka-entity-topic-operator   # Strimzi Topic Operator (TLS cert)
      - User:CN=my-kafka-entity-user-operator    # Strimzi User Operator (TLS cert)
      - User:CN=my-kafka-kafka-exporter          # Kafka Exporter metrics user (TLS cert)

  # Kafka listeners configuration
  listeners:
    # Internal cluster access with SCRAM-SHA-512 authentication
    plain:
      enabled: true
      port: 9092
      type: internal
      tls: false
      authentication:
        type: scram-sha-512

    # External access via INTERNET-FACING NLB with SCRAM-SHA-512 authentication
    external:
      enabled: true
      port: 9094
      type: loadbalancer
      tls: false
      authentication:
        type: scram-sha-512
      annotations:
        service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
        service.beta.kubernetes.io/aws-load-balancer-internal: "false"
        service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
        external-dns.alpha.kubernetes.io/hostname: "kafka-sandbox.aws.internal"
        # Restrict access to specific IPs in production
        # service.beta.kubernetes.io/load-balancer-source-ranges: "YOUR_IP/32"

    # TLS listener (disabled for sandbox)
    tls:
      enabled: false
      port: 9093

# Single combined node (controller + broker) for sandbox
nodePools:
  - name: combined
    roles:
      - controller
      - broker
    replicas: 1
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 10Gi
          deleteClaim: false
          class: gp2
    resources:
      requests:
        memory: 1Gi
        cpu: 500m
      limits:
        memory: 2Gi
        cpu: 1000m
    jvmOptions:
      xms: 512m
      xmx: 1024m

# Enable monitoring for testing
monitoring:
  serviceMonitor:
    enabled: false
  podMonitor:
    enabled: false

# Kafka UI - enabled with internet-facing NLB for sandbox testing
kafkaUI:
  enabled: true
  kafka:
    sasl:
      enabled: true  # Kafka requires SCRAM-SHA-512 on port 9092
  service:
    type: LoadBalancer
    port: 8080
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-internal: "false"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      external-dns.alpha.kubernetes.io/hostname: "kafka-ui-sandbox.aws.internal"

# AWS Glue Schema Registry - enabled for sandbox testing
# After terraform apply, set roleArn from:
#   terraform -chdir=../eks-kafka/environments/sandbox output kafka_schema_registry_role_arn
glueSchemaRegistry:
  enabled: true
  region: eu-north-1
  registryName: ltim-sandbox-kafka-registry
  compatibility: BACKWARD
  autoRegistration: true
  serviceAccount:
    roleArn: "arn:aws:iam::292481751409:role/ltim-sandbox-kafka-schema-registry-role"

# Enable example topics for sandbox testing
topics:
  enabled: true
  topics:
    - name: sandbox-test-topic
      partitions: 1
      replicas: 1
      config:
        retention.ms: 172800000  # 2 days
        cleanup.policy: delete

# Kafka users with SCRAM-SHA-512 auth and ACL-based authorization
# Strimzi User Operator creates a Kubernetes Secret for each user with generated credentials:
#   kubectl get secret <username> -n kafka -o jsonpath='{.data.password}' | base64 -d
users:
  enabled: true
  users:
    # Producer: can write to all topics
    - name: kafka-producer
      authentication:
        type: scram-sha-512
      authorization:
        type: simple
        acls:
          - resource:
              type: topic
              name: "*"
              patternType: literal
            operations:
              - Write
              - Describe
              - Create

    # Consumer: can read from all topics and manage consumer groups
    - name: kafka-consumer
      authentication:
        type: scram-sha-512
      authorization:
        type: simple
        acls:
          - resource:
              type: topic
              name: "*"
              patternType: literal
            operations:
              - Read
              - Describe
          - resource:
              type: group
              name: "*"
              patternType: literal
            operations:
              - Read
              - Describe

    # Admin: full access to all topics and groups
    - name: kafka-admin
      authentication:
        type: scram-sha-512
      authorization:
        type: simple
        acls:
          - resource:
              type: topic
              name: "*"
              patternType: literal
            operations:
              - All
          - resource:
              type: group
              name: "*"
              patternType: literal
            operations:
              - All
          - resource:
              type: cluster
              name: kafka-cluster
              patternType: literal
            operations:
              - All
