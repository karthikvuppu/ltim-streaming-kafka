{{- if .Values.users.enabled }}
{{- range .Values.users.users }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ $.Values.kafka.name }}
    {{- include "kafka-eks.labels" $ | nindent 4 }}
spec:
  authentication:
    type: {{ .authentication.type }}
  {{- if .authorization }}
  authorization:
    type: {{ .authorization.type }}
    {{- if .authorization.acls }}
    acls:
      {{- range .authorization.acls }}
      - resource:
          type: {{ .resource.type }}
          name: {{ .resource.name | quote }}
          patternType: {{ .resource.patternType }}
        operations:
          {{- toYaml .operations | nindent 10 }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- end }}
