apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: {{ .Values.kafka.name }}
  namespace: {{ .Release.Namespace }}
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
  labels:
    {{- include "kafka-eks.labels" . | nindent 4 }}
spec:
  kafka:
    version: {{ .Values.kafka.version }}
    metadataVersion: {{ .Values.kraft.metadataVersion | quote }}
    {{- if .Values.kafka.podSecurityContext.enabled }}
    template:
      pod:
        securityContext:
          runAsNonRoot: {{ .Values.kafka.podSecurityContext.runAsNonRoot }}
          runAsUser: {{ .Values.kafka.podSecurityContext.runAsUser }}
          fsGroup: {{ .Values.kafka.podSecurityContext.fsGroup }}
          {{- if .Values.kafka.podSecurityContext.seccompProfile }}
          seccompProfile:
            type: {{ .Values.kafka.podSecurityContext.seccompProfile.type }}
          {{- end }}
        containers:
          - name: kafka
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: false
    {{- end }}
    listeners:
      {{- if .Values.kafka.listeners.plain.enabled }}
      - name: plain
        port: {{ .Values.kafka.listeners.plain.port }}
        type: {{ .Values.kafka.listeners.plain.type }}
        tls: {{ .Values.kafka.listeners.plain.tls }}
        {{- if .Values.kafka.listeners.plain.authentication.type }}
        authentication:
          type: {{ .Values.kafka.listeners.plain.authentication.type }}
        {{- end }}
      {{- end }}
      {{- if .Values.kafka.listeners.external.enabled }}
      - name: external
        port: {{ .Values.kafka.listeners.external.port }}
        type: {{ .Values.kafka.listeners.external.type }}
        tls: {{ .Values.kafka.listeners.external.tls }}
        {{- if .Values.kafka.listeners.external.authentication.type }}
        authentication:
          type: {{ .Values.kafka.listeners.external.authentication.type }}
        {{- end }}
        configuration:
          bootstrap:
            annotations:
              {{- toYaml .Values.kafka.listeners.external.annotations | nindent 14 }}
      {{- end }}
      {{- if .Values.kafka.listeners.tls.enabled }}
      - name: tls
        port: {{ .Values.kafka.listeners.tls.port }}
        type: {{ .Values.kafka.listeners.tls.type }}
        tls: true
        {{- if .Values.kafka.listeners.tls.authentication.type }}
        authentication:
          type: {{ .Values.kafka.listeners.tls.authentication.type }}
        {{- end }}
      {{- end }}
    {{- if .Values.kafka.authorization.type }}
    authorization:
      type: {{ .Values.kafka.authorization.type }}
      {{- if .Values.kafka.authorization.superUsers }}
      superUsers:
        {{- toYaml .Values.kafka.authorization.superUsers | nindent 8 }}
      {{- end }}
    {{- end }}
    config:
      {{- toYaml .Values.kafka.config | nindent 6 }}
    resources:
      {{- toYaml .Values.kafka.resources | nindent 6 }}
    jvmOptions:
      -Xms: {{ .Values.kafka.jvmOptions.xms }}
      -Xmx: {{ .Values.kafka.jvmOptions.xmx }}
    {{- if .Values.kafka.metrics.enabled }}
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: {{ .Values.kafka.name }}-metrics
          key: kafka-metrics-config.yml
    {{- end }}
    logging:
      type: inline
      loggers:
        kafka.root.logger.level: {{ .Values.kafka.logging.level | quote }}
        log4j.logger.org.apache.zookeeper: {{ .Values.kafka.logging.zookeeperLogLevel | quote }}
        {{- if .Values.kafka.logging.auditLogging.enabled }}
        {{- range $key, $value := .Values.kafka.logging.auditLogging.loggers }}
        {{ $key }}: {{ $value | quote }}
        {{- end }}
        {{- end }}

  {{- if .Values.entityOperator.enabled }}
  entityOperator:
    topicOperator:
      resources:
        {{- toYaml .Values.entityOperator.topicOperator.resources | nindent 8 }}
    userOperator:
      resources:
        {{- toYaml .Values.entityOperator.userOperator.resources | nindent 8 }}
  {{- end }}
