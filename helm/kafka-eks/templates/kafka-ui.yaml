{{- if .Values.kafkaUI.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-eks.labels" . | nindent 4 }}
    app: kafka-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-ui
  template:
    metadata:
      labels:
        {{- include "kafka-eks.selectorLabels" . | nindent 8 }}
        app: kafka-ui
    spec:
      containers:
        - name: kafka-ui
          image: "{{ .Values.kafkaUI.image.repository }}:{{ .Values.kafkaUI.image.tag }}"
          imagePullPolicy: {{ .Values.kafkaUI.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: KAFKA_CLUSTERS_0_NAME
              value: {{ .Values.kafka.name }}
            - name: KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS
              value: "{{ .Values.kafka.name }}-kafka-bootstrap:9092"
            {{- if .Values.kafkaUI.kafka.sasl.enabled }}
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL
              value: "SASL_PLAINTEXT"
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM
              value: "SCRAM-SHA-512"
            - name: _KAFKA_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.kafkaUI.kafka.sasl.secretName }}
                  key: password
            - name: KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG
              value: 'org.apache.kafka.common.security.scram.ScramLoginModule required username="{{ .Values.kafkaUI.kafka.sasl.username }}" password="$(_KAFKA_ADMIN_PASSWORD)";'
            {{- end }}
            {{- if .Values.kafkaUI.auth.enabled }}
            - name: AUTH_TYPE
              value: "LOGIN_FORM"
            - name: SPRING_SECURITY_USER_NAME
              value: {{ .Values.kafkaUI.auth.username | quote }}
            - name: SPRING_SECURITY_USER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kafka-ui-auth
                  key: password
            {{- end }}
          resources:
            {{- toYaml .Values.kafkaUI.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-eks.labels" . | nindent 4 }}
    app: kafka-ui
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.kafkaUI.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: kafka-ui
{{- if eq .Values.kafkaUI.service.type "LoadBalancer" }}
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-ui-external
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-eks.labels" . | nindent 4 }}
    app: kafka-ui
  annotations:
    {{- toYaml .Values.kafkaUI.service.annotations | nindent 4 }}
spec:
  type: LoadBalancer
  ports:
    - port: {{ .Values.kafkaUI.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: kafka-ui
{{- end }}
{{- if .Values.kafkaUI.auth.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: kafka-ui-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-eks.labels" . | nindent 4 }}
    app: kafka-ui
type: Opaque
data:
  password: {{ .Values.kafkaUI.auth.password | b64enc | quote }}
{{- end }}
{{- end }}
