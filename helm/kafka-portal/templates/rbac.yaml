{{- if .Values.fastapi.enabled }}
{{- $saName := ternary .Values.fastapi.serviceAccount.name "default" .Values.fastapi.serviceAccount.create }}
# Allows kafka-portal-api to read KafkaTopics, KafkaUsers, Kafkas and Secrets in the kafka namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kafka-portal-api-reader
  namespace: kafka
rules:
  - apiGroups: ["kafka.strimzi.io"]
    resources: ["kafkatopics", "kafkausers", "kafkas"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kafka-portal-api-reader
  namespace: kafka
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kafka-portal-api-reader
subjects:
  - kind: ServiceAccount
    name: {{ $saName }}
    namespace: {{ .Release.Namespace }}
{{- end }}
