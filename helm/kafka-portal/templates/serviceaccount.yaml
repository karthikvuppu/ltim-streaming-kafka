{{- if and .Values.fastapi.enabled .Values.fastapi.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.fastapi.serviceAccount.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kafka-portal.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.fastapi.serviceAccount.roleArn | quote }}
{{- end }}
