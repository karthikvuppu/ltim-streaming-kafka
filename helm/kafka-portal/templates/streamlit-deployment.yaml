{{- if .Values.streamlit.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka-portal-ui
  namespace: {{ .Release.Namespace }}
  labels:
    app: kafka-portal-ui
    {{- include "kafka-portal.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.streamlit.replicas }}
  selector:
    matchLabels:
      app: kafka-portal-ui
  template:
    metadata:
      labels:
        app: kafka-portal-ui
    spec:
      containers:
        - name: ui
          image: "{{ .Values.streamlit.image.repository }}:{{ .Values.streamlit.image.tag }}"
          imagePullPolicy: {{ .Values.streamlit.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.streamlit.port }}
          # Non-sensitive env vars from values
          env:
            {{- range $key, $val := .Values.streamlit.env }}
            - name: {{ $key }}
              value: {{ $val | quote }}
            {{- end }}
          # Sensitive env vars (CLIENT_ID, CLIENT_SECRET) from secret
          envFrom:
            - secretRef:
                name: {{ .Values.streamlit.secretName }}
          resources:
            {{- toYaml .Values.streamlit.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: {{ .Values.streamlit.port }}
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: {{ .Values.streamlit.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
{{- end }}
