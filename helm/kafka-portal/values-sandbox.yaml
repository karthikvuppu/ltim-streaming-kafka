# Sandbox overrides
# After terraform apply, fill in the Cognito values from:
#   terraform -chdir=../eks-kafka/environments/sandbox output cognito_domain
#   terraform -chdir=../eks-kafka/environments/sandbox output cognito_client_id

fastapi:
  image:
    tag: "c6cb4d05"
  serviceAccount:
    roleArn: "arn:aws:iam::292481751409:role/ltim-sandbox-kafka-portal-bedrock-role"

streamlit:
  image:
    tag: "c6cb4d05"
  service:
    type: LoadBalancer
    port: 8501
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      external-dns.alpha.kubernetes.io/hostname: "kafka-portal-sandbox.aws.internal"
  env:
    API_URL: "http://kafka-portal-api:8000"
