# Sandbox overrides

fastapi:
  image:
    tag: "a61d4acd"

streamlit:
  image:
    tag: "a61d4acd"
  service:
    type: LoadBalancer
    port: 8501
    annotations:
      service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
      service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
      external-dns.alpha.kubernetes.io/hostname: "kafka-portal-sandbox.aws.internal"
  env:
    API_URL: "http://kafka-portal-api:8000"
