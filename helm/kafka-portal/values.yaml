# Default values — override per environment

fastapi:
  enabled: true
  image:
    repository: "292481751409.dkr.ecr.eu-north-1.amazonaws.com/kafka-portal-api"
    tag: "latest"
    pullPolicy: Always
  replicas: 1
  port: 8000
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  service:
    type: ClusterIP
    port: 8000
  # IRSA ServiceAccount — gives the pod permission to call Bedrock (no API key needed)
  # Set roleArn after: terraform -chdir=../eks-kafka/environments/sandbox apply
  #   output: kafka_portal_bedrock_role_arn
  serviceAccount:
    create: true
    name: kafka-portal-api-sa
    roleArn: ""   # set in values-sandbox.yaml

  # Bedrock config (no secret needed — IAM via IRSA)
  env:
    BEDROCK_REGION: "eu-west-1"
    BEDROCK_MODEL: "eu.anthropic.claude-3-haiku-20240307-v1:0"
    BEDROCK_REVIEW_MODEL: "eu.anthropic.claude-3-haiku-20240307-v1:0"
    KAFKA_CLUSTER_NAME: "my-kafka"
    GITHUB_REPO: "karthikvuppu/ltim-streaming-kafka"

  # Secret name for remaining sensitive values (GITHUB_TOKEN, Cognito):
  #   kubectl create secret generic kafka-portal-secrets \
  #     --from-literal=GITHUB_TOKEN=ghp_... \
  #     --from-literal=COGNITO_REGION=eu-north-1 \
  #     --from-literal=COGNITO_USER_POOL_ID=eu-north-1_lYnTusC49 \
  #     --from-literal=COGNITO_CLIENT_ID=232lq00pndiakq3ldfvnqhf2ed \
  #     --from-literal=COGNITO_CLIENT_SECRET=70o15kkjsg2f2ordu9kr9bn5d5s8mh64go72ku87j3c2j9ajn8e \
  #     -n kafka-portal
  secretName: kafka-portal-secrets

streamlit:
  enabled: true
  image:
    repository: "292481751409.dkr.ecr.eu-north-1.amazonaws.com/kafka-portal-ui"
    tag: "latest"
    pullPolicy: Always
  replicas: 1
  port: 8501
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  service:
    type: ClusterIP
    port: 8501
  # Env vars injected into Streamlit (non-sensitive — override in values-sandbox.yaml)
  env:
    API_URL: "http://kafka-portal-api:8000"
    REDIRECT_URI: "http://localhost:8501"
    COGNITO_DOMAIN: ""
  # Sensitive Streamlit config (CLIENT_ID, CLIENT_SECRET) also from secretName above
  secretName: kafka-portal-secrets
