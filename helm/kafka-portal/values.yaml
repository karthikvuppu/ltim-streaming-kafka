# Default values — override per environment

fastapi:
  enabled: true
  image:
    repository: "058006294933.dkr.ecr.eu-north-1.amazonaws.com/kafka-portal-api"
    tag: "latest"
    pullPolicy: Always
  replicas: 1
  port: 8000
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  service:
    type: ClusterIP
    port: 8000
  serviceAccount:
    create: false
    name: kafka-portal-api-sa

  env:
    KAFKA_CLUSTER_NAME: "my-kafka"
    GITHUB_REPO: "karthikvuppu/ltim-streaming-kafka"

  # Secret name — create once per cluster:
  #   kubectl create secret generic kafka-portal-secrets \
  #     --from-literal=GITHUB_TOKEN=ghp_... \
  #     --from-literal=OPENAI_API_KEY=sk-... \
  #     --from-literal=COGNITO_REGION=eu-north-1 \
  #     --from-literal=COGNITO_USER_POOL_ID=<pool-id> \
  #     --from-literal=COGNITO_CLIENT_ID=<client-id> \
  #     --from-literal=COGNITO_CLIENT_SECRET=<client-secret> \
  #     -n kafka-portal
  secretName: kafka-portal-secrets

streamlit:
  enabled: true
  image:
    repository: "058006294933.dkr.ecr.eu-north-1.amazonaws.com/kafka-portal-ui"
    tag: "latest"
    pullPolicy: Always
  replicas: 1
  port: 8501
  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m
  service:
    type: ClusterIP
    port: 8501
  env:
    API_URL: "http://kafka-portal-api:8000"
  # Sensitive Streamlit config (CLIENT_ID, CLIENT_SECRET) also from secretName above
  secretName: kafka-portal-secrets
