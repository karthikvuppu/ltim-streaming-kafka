# ArgoCD Application — watches gitops/sandbox/kafka/ for KafkaTopic + KafkaUser YAMLs
# ArgoCD auto-syncs any YAML committed to this path into the kafka namespace
#
# Apply with:
#   kubectl apply -f argocd/kafka-topics-app.yaml -n argocd

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-topics-sandbox
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/karthikvuppu/ltim-streaming-kafka
    targetRevision: main
    path: gitops/sandbox/kafka

  destination:
    server: https://kubernetes.default.svc
    namespace: kafka

  syncPolicy:
    automated:
      prune: true      # Delete resources removed from git
      selfHeal: true   # Revert manual changes in cluster
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
