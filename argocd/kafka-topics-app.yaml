# ArgoCD Application — watches gitops/sandbox/kafka/ for KafkaTopic + KafkaUser YAMLs
# Manual sync: admin reviews in ArgoCD UI then clicks Sync after each PR merges.
# GitHub webhook triggers instant OutOfSync detection on push to main.
#
# Apply with:
#   kubectl apply -f argocd/kafka-topics-app.yaml -n argocd

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kafka-topics-sandbox
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default

  source:
    repoURL: https://github.com/karthikvuppu/ltim-streaming-kafka
    targetRevision: main
    path: gitops/sandbox/kafka
    directory:
      recurse: true   # scan topics/ and users/ subdirectories

  destination:
    server: https://kubernetes.default.svc
    namespace: kafka

  syncPolicy:
    # No automated sync — admin manually reviews and syncs via ArgoCD UI
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
