apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: payments-producer
  namespace: kafka
  labels:
    strimzi.io/cluster: my-kafka
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: payments.karthikdemotest.created
        patternType: literal
      operations:
      - Write
      - Describe
